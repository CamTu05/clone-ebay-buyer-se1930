log_format loadtest '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'request_time=$request_time upstream_time=$upstream_response_time';

limit_req_zone $binary_remote_addr zone=buyer_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=buyer_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=buyer_sse:10m;

upstream buyer_api {
    least_conn;
    server api1:8080 max_fails=3 fail_timeout=10s;
    server api2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log loadtest;
    limit_req_status 429;

    location = /api/auth/login {
        limit_req zone=buyer_login burst=3 nodelay;
        proxy_pass http://buyer_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header X-Load-Balancer nginx always;
        add_header X-Upstream-Addr $upstream_addr always;
    }

    location ~ ^/api/auctions/[0-9]+/events$ {
        limit_conn buyer_sse 5;
        proxy_pass http://buyer_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Load-Balancer nginx always;
        add_header X-Upstream-Addr $upstream_addr always;
    }

    location /api/ {
        limit_req zone=buyer_api burst=20 nodelay;
        proxy_pass http://buyer_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Load-Balancer nginx always;
        add_header X-Upstream-Addr $upstream_addr always;
    }

    location /health/ {
        proxy_pass http://buyer_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Load-Balancer nginx always;
        add_header X-Upstream-Addr $upstream_addr always;
    }

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-RateLimit-Policy nginx always;
        return 429 '{"success":false,"message":"Too many requests","errors":[{"code":"RATE_LIMIT_EXCEEDED"}]}';
    }
}

# Capacity port: same load balancer and upstreams, intentionally without request-rate limiting.
# It is exposed only by the isolated load-test compose stack.
server {
    listen 81;
    server_name _;
    access_log /var/log/nginx/capacity.log loadtest;

    location / {
        proxy_pass http://buyer_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Load-Balancer nginx-capacity always;
        add_header X-Upstream-Addr $upstream_addr always;
    }
}
