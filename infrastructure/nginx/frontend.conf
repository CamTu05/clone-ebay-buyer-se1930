limit_req_zone $binary_remote_addr zone=buyer_api:10m rate=10r/s;

upstream buyer_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=buyer_api burst=20 nodelay;
        proxy_pass http://buyer_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://buyer_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
