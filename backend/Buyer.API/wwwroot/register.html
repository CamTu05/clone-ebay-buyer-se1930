<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Clone - Đăng ký tài khoản Buyer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f7f7f7;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 20px 40px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
    }
    .logo span:nth-child(1) { color: #e53238; }
    .logo span:nth-child(2) { color: #0064d2; }
    .logo span:nth-child(3) { color: #f5af02; }
    .logo span:nth-child(4) { color: #86b817; }
    .swagger-link {
      color: #0064d2;
      font-size: 14px;
      text-decoration: none;
      font-weight: 500;
    }
    .swagger-link:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 480px;
      width: 100%;
      margin: 40px auto;
      background: #fff;
      padding: 36px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #191919;
    }
    p.subtitle {
      font-size: 14px;
      color: #707070;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #c7c7c7;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #0064d2;
      box-shadow: 0 0 0 3px rgba(0,100,210,0.15);
    }
    .btn {
      width: 100%;
      padding: 13px;
      background-color: #0064d2;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0053ba;
    }
    .btn:disabled {
      background-color: #a0c3ee;
      cursor: not-allowed;
    }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
    }
    .alert-error {
      background-color: #fde8e8;
      border: 1px solid #f8b4b4;
      color: #9b1c1c;
    }
    .alert-success {
      background-color: #def7ec;
      border: 1px solid #bcf0da;
      color: #03543f;
    }
    .token-box {
      margin-top: 10px;
      padding: 8px;
      background: #f1f5f9;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      max-height: 80px;
      overflow-y: auto;
    }
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #707070;
    }
    .footer-note a {
      color: #0064d2;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <a href="/register.html" class="logo">
      <span>e</span><span>b</span><span>a</span><span>y</span>
    </a>
    <a href="/swagger" class="swagger-link">📖 Mở API Swagger Docs</a>
  </header>

  <div class="container">
    <h1>Tạo tài khoản Buyer</h1>
    <p class="subtitle">Đăng ký để mua sắm và theo dõi đơn hàng trên eBay Clone</p>

    <div id="alertError" class="alert alert-error"></div>
    <div id="alertSuccess" class="alert alert-success"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="username">Tên người dùng (Username / Tên đầy đủ) *</label>
        <input type="text" id="username" placeholder="Ví dụ: nguyenvana" required minlength="2" maxlength="100">
      </div>

      <div class="form-group">
        <label for="email">Địa chỉ Email *</label>
        <input type="email" id="email" placeholder="Ví dụ: nguyenvana@gmail.com" required maxlength="255">
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu * (Tối thiểu 6 ký tự)</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu an toàn" required minlength="6" maxlength="100">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Xác nhận mật khẩu *</label>
        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required minlength="6" maxlength="100">
      </div>

      <button type="submit" id="submitBtn" class="btn">Tạo tài khoản</button>
    </form>

    <div class="footer-note">
      Đã có tài khoản? Bạn có thể kiểm tra đăng nhập trên <a href="/swagger">Swagger</a>.
    </div>
  </div>

  <script>
    async function handleRegister(e) {
      e.preventDefault();
      
      const errBox = document.getElementById('alertError');
      const succBox = document.getElementById('alertSuccess');
      const submitBtn = document.getElementById('submitBtn');
      
      errBox.style.display = 'none';
      succBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errBox.textContent = 'Mật khẩu xác nhận không khớp!';
        errBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang xử lý đăng ký...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: username,
            email: email,
            password: password
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          succBox.innerHTML = `
            <strong>🎉 Đăng ký tài khoản thành công!</strong><br>
            - Mã Buyer ID: <b>${result.data.user.id}</b><br>
            - Username: <b>${result.data.user.username}</b><br>
            - Email: <b>${result.data.user.email}</b><br>
            - Role: <b>${result.data.user.role}</b><br>
            <div style="margin-top: 8px;"><b>Access Token (JWT):</b></div>
            <div class="token-box">${result.data.accessToken}</div>
          `;
          succBox.style.display = 'block';
          document.getElementById('registerForm').reset();
        } else {
          let errorMsg = result.message || 'Đăng ký thất bại';
          if (result.errors && result.errors.length > 0) {
            errorMsg += ': ' + result.errors.map(err => err.code || err).join(', ');
          }
          errBox.textContent = '❌ Lỗi: ' + errorMsg;
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = '❌ Không thể kết nối tới server: ' + err.message;
        errBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Tạo tài khoản';
      }
    }
  </script>
</body>
</html>
